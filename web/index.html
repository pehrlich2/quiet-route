<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiet Route Planner</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<aside id="side">
  <header>
    <div class="eyebrow">Quiet Route Hauling</div>
    <h1>Route planner</h1>
  </header>

  <section>
    <h2>Customers</h2>
    <form id="planForm">
      <div class="row"><label for="customers">Customers</label><input id="customers" type="number" min="10" max="4000" step="10"></div>
      <fieldset id="towns"><legend>Towns</legend></fieldset>
      <div class="row"><label for="adoption">Sign-up pattern</label>
        <select id="adoption"><option value="uniform">Scattered</option><option value="clustered">Clustered (word of mouth)</option></select></div>
      <div class="row"><label for="assign">Day split</label>
        <select id="assign"><option value="town">One town per day</option><option value="sweep">Pie slices around Williston</option></select></div>
      <div class="row"><label for="lbs_per_stop">Lb per pickup</label><input id="lbs_per_stop" type="number" step="5"></div>
      <div class="row"><label for="load_lbs">Trailer load (lb)</label><input id="load_lbs" type="number" step="250"></div>
      <div class="row"><label for="stop_min">Minutes per stop</label><input id="stop_min" type="number" step="0.25"></div>
      <div class="row"><label for="dump_min">Minutes at dump</label><input id="dump_min" type="number" step="5"></div>
      <div class="row"><label for="seed">Random seed</label><input id="seed" type="number" step="1"></div>
      <button id="solveBtn" type="submit">Re-plan routes</button>
      <div id="status" class="status" role="status"></div>
    </form>
  </section>

  <section>
    <h2>Battery</h2>
    <div class="seg" role="radiogroup" aria-label="Season">
      <input type="radio" name="season" id="sSummer" value="summer"><label for="sSummer">Summer</label>
      <input type="radio" name="season" id="sWinter" value="winter" checked><label for="sWinter">Winter</label>
    </div>
    <div class="row"><label for="battery">Battery (kWh)</label><input id="battery" type="number" value="200" step="5"></div>
    <div class="row"><label for="reserve">Keep in reserve (%)</label><input id="reserve" type="number" value="15" step="5"></div>
    <div class="row"><label for="kwhmi">Towing kWh / mile</label><input id="kwhmi" type="number" value="1.2" step="0.05"></div>
    <div class="row"><label for="winterPen">Winter driving penalty (%)</label><input id="winterPen" type="number" value="35" step="5"></div>
    <div class="row"><label for="heatKw">Winter cab heat (kW)</label><input id="heatKw" type="number" value="4" step="0.5"></div>
    <div class="row"><label for="tipKwh">Tipper kWh / stop</label><input id="tipKwh" type="number" value="0.03" step="0.01"></div>
    <div class="row"><label for="workHrs">Workday (hours)</label><input id="workHrs" type="number" value="9" step="0.5"></div>
  </section>

  <section>
    <h2>Summary</h2>
    <div id="tiles" class="tiles"></div>
    <p id="capNote" class="note"></p>
  </section>

  <section>
    <h2>Service days <button id="showAll" class="link" type="button">show all</button></h2>
    <div class="tblwrap"><table id="days">
      <thead><tr><th>Day</th><th class="n">Stops</th><th class="n">Miles</th><th class="n">Loads</th><th class="n">Hours</th><th class="n">Battery</th></tr></thead>
      <tbody></tbody>
    </table></div>
    <label class="check"><input id="showHomes" type="checkbox" checked> Show all homes (gray)</label>
  </section>

  <footer>Addresses: Vermont E911 address points (VCGI). Roads: © OpenStreetMap contributors. Routing: OR-Tools.</footer>
</aside>
<main id="map"></main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
